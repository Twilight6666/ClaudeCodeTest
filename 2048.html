<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #faf8ef;
    font-family: 'Segoe UI', 'Clear Sans', system-ui, sans-serif;
  }

  .container {
    width: 460px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .title {
    font-size: 64px;
    font-weight: 800;
    color: #776e65;
    line-height: 1;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    border-radius: 6px;
    padding: 8px 20px;
    text-align: center;
    min-width: 80px;
  }

  .score-label {
    font-size: 11px;
    color: #eee4da;
    text-transform: uppercase;
    font-weight: 700;
  }

  .score-value {
    font-size: 22px;
    color: #fff;
    font-weight: 700;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .new-game {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .new-game:hover { background: #9f8b77; }

  .hint {
    color: #776e65;
    font-size: 14px;
  }

  .game-board {
    position: relative;
    background: #bbada0;
    border-radius: 8px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    aspect-ratio: 1;
  }

  .cell {
    background: #cdc1b4;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: #776e65;
    aspect-ratio: 1;
    transition: transform 0.08s ease;
  }

  .tile-2    { background: #eee4da; }
  .tile-4    { background: #ede0c8; }
  .tile-8    { background: #f2b179; color: #f9f6f2; }
  .tile-16   { background: #f59563; color: #f9f6f2; }
  .tile-32   { background: #f67c5f; color: #f9f6f2; }
  .tile-64   { background: #f65e3b; color: #f9f6f2; }
  .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 28px; }
  .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 28px; }
  .tile-512  { background: #edc850; color: #f9f6f2; font-size: 28px; }
  .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }
  .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }
  .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 20px; }

  .tile-pop { animation: pop 0.15s ease; }

  @keyframes pop {
    0%   { transform: scale(0); }
    80%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    gap: 16px;
  }

  .overlay.hidden { display: none; }

  .overlay-message {
    font-size: 42px;
    font-weight: 800;
    color: #776e65;
  }

  .overlay button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 28px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .overlay button:hover { background: #9f8b77; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">分数</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">最高</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="new-game" id="newGame">新游戏</button>
    <span class="hint">方向键 / WASD / 滑动 操作</span>
  </div>

  <div class="game-board" id="board">
    <div class="overlay hidden" id="overlay">
      <div class="overlay-message" id="overlayMsg">你赢了！</div>
      <button id="overlayBtn">再来一局</button>
    </div>
  </div>
</div>

<script>
(function () {
  const SIZE = 4;
  const TILE_CLASSES = [null, null,
    'tile-2','tile-4','tile-8','tile-16','tile-32','tile-64',
    'tile-128','tile-256','tile-512','tile-1024','tile-2048'
  ];

  let grid = [];
  let score = 0;
  let best = 0;
  let gameOver = false;
  let won = false;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');

  function getTileClass(val) {
    if (val === 0) return '';
    return TILE_CLASSES[Math.min(val, 2048)] || 'tile-super';
  }

  function loadBest() {
    best = parseInt(localStorage.getItem('best2048')) || 0;
    bestEl.textContent = best;
  }

  function saveBest() {
    if (score > best) {
      best = score;
      localStorage.setItem('best2048', best);
      bestEl.textContent = best;
    }
  }

  function initGrid() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    gameOver = false;
    won = false;
    scoreEl.textContent = '0';
    overlay.classList.add('hidden');
    addRandom();
    addRandom();
    render();
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) cells.push({ r, c });
      }
    }
    return cells;
  }

  function addRandom() {
    const cells = emptyCells();
    if (cells.length === 0) return;
    const { r, c } = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    boardEl.querySelectorAll('.cell').forEach(el => el.remove());

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (val > 0) {
          cell.classList.add(getTileClass(val));
          cell.textContent = val;
        }
        boardEl.appendChild(cell);
      }
    }

    scoreEl.textContent = score;
    saveBest();
  }

  function slide(row) {
    let arr = row.filter(v => v !== 0);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        score += arr[i];
        arr[i + 1] = 0;
      }
    }
    arr = arr.filter(v => v !== 0);
    while (arr.length < SIZE) arr.push(0);
    return arr;
  }

  function move(direction) {
    if (gameOver) return;

    const oldGrid = grid.map(r => [...r]);

    for (let r = 0; r < SIZE; r++) {
      let row = [];

      switch (direction) {
        case 'left':
          row = [...grid[r]];
          break;
        case 'right':
          row = [...grid[r]].reverse();
          break;
        case 'up':
          for (let c = 0; c < SIZE; c++) row.push(grid[c][r]);
          break;
        case 'down':
          for (let c = SIZE - 1; c >= 0; c--) row.push(grid[c][r]);
          break;
      }

      const slid = slide(row);

      switch (direction) {
        case 'left':
          grid[r] = slid;
          break;
        case 'right':
          grid[r] = slid.reverse();
          break;
        case 'up':
          for (let c = 0; c < SIZE; c++) grid[c][r] = slid[c];
          break;
        case 'down':
          const rev = slid.reverse();
          for (let c = 0; c < SIZE; c++) grid[c][r] = rev[c];
          break;
      }
    }

    const changed = !grid.every((row, r) =>
      row.every((v, c) => v === oldGrid[r][c])
    );

    if (changed) {
      addRandom();
      render();
      checkState();
    }
  }

  function checkState() {
    // Check for 2048 win
    if (!won && grid.some(row => row.some(v => v === 2048))) {
      won = true;
      overlayMsg.textContent = '你赢了！';
      overlay.classList.remove('hidden');
    }

    // Check for moves
    if (emptyCells().length > 0) return;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return;
      }
    }

    gameOver = true;
    overlayMsg.textContent = '游戏结束';
    overlay.classList.remove('hidden');
  }

  // Touch support
  let touchStartX = 0;
  let touchStartY = 0;

  boardEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  boardEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (Math.max(absDx, absDy) < 20) return;

    if (absDx > absDy) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    const keyMap = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right'
    };
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // Buttons
  document.getElementById('newGame').addEventListener('click', initGrid);
  document.getElementById('overlayBtn').addEventListener('click', initGrid);

  loadBest();
  initGrid();
})();
</script>
</body>
</html>
